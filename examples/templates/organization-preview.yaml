# Preview first; apply creates directories and moves files with mandatory history.
version: 1
name: Organize screenshots
rules:
  - id: screenshots
    match:
      glob: ["Screenshot*", "Screen Shot*"]
      extensions: [".png"]
    move:
      root: "~/Pictures/Renym"
      directory: 'screenshots/${file.modified | date("month")}'
    rename:
      filename: '${file.stem | snake}${file.ext | lower}'
