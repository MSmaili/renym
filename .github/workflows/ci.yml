name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Organization acceptance tests
        run: go test -tags=renym_organization_acceptance ./...

      - name: Organization acceptance race detector
        run: go test -race -tags=renym_organization_acceptance ./...

      - name: Organization acceptance vet
        run: go vet -tags=renym_organization_acceptance ./...
